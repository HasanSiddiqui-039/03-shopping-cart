<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Mart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">Fresh Mart</h1>
      <a href="#cart" class="cart-link">
        Cart <span id="cart-count" class="cart-count">0</span>
      </a>
    </div>
  </header>

  <main class="page">

    <!-- PRODUCTS -->
    <section class="shop">
      <div class="shop-top">
        <h2>Today's groceries</h2>
        <div class="categories" id="categories">
          <button class="category-btn active" data-category="all">All</button>
          <button class="category-btn" data-category="fruits">Fruits</button>
          <button class="category-btn" data-category="vegetables">Vegetables</button>
          <button class="category-btn" data-category="dairy">Dairy &amp; bakery</button>
        </div>
      </div>

      <!-- Product cards are created by JavaScript -->
      <div id="product-grid" class="product-grid"></div>
    </section>

    <!-- CART -->
    <aside class="cart" id="cart">
      <h2>Your cart</h2>

      <ul id="cart-items" class="cart-items"></ul>
      <p id="cart-empty" class="cart-empty">Your cart is empty. Add items from the shop.</p>

      <div id="cart-summary" class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rs 0</span></div>
        <div class="summary-row"><span>Delivery</span><span id="delivery">Rs 0</span></div>
        <p id="delivery-note" class="delivery-note"></p>
        <div class="summary-row total"><span>Total</span><span id="total">Rs 0</span></div>

        <button id="checkout-btn" class="btn-checkout">Place order</button>
        <button id="clear-cart-btn" class="btn-clear">Empty cart</button>
      </div>
    </aside>

  </main>

  <!-- Small popup message, shown by JS -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
